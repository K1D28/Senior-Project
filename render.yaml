services:
  - type: web
    name: backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: SUPABASE_URL
        value: https://mbmilbbdjywnmagxfcyg.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://senior-project-frontend.onrender.com
      - key: APP_URL
        value: https://senior-project-frontend.onrender.com
      - key: BACKEND_URL
        value: https://senior-project-a0jj.onrender.com/
      - key: VITE_BACKEND_URL
        value: https://your-backend-url.onrender.com
      - key: NODEMAILER_EMAIL
        sync: false
      - key: NODEMAILER_EMAIL_PASSWORD
        sync: false
      - key: CLAUDE_API_KEY
        sync: false

  - type: static
    name: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://your-backend-url.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://mbmilbbdjywnmagxfcyg.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
